name: Release zip

# Attaches the installable zip (the same one WordPress.org gets) to every published GitHub release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build-zip.sh
      - name: Attach to the release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/hermaily-*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
